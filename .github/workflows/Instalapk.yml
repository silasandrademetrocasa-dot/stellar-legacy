
name: '🚀 Stellar Legacy — APK Local'
run-name: 'Compilar Stellar APK • ${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Gerar APK release assinado (exige os 4 secrets de assinatura)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stellar-apk-v64
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STELLAR_SERVER_URL: ${{ vars.STELLAR_SERVER_URL }}

    steps:
      - name: Baixar o codigo V64
        uses: actions/checkout@v4

      - name: Validar dominio do Render
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$STELLAR_SERVER_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo 'Configure STELLAR_SERVER_URL nas variaveis do GitHub.'
            echo 'Exemplo: https://seu-servico.onrender.com'
            exit 1
          fi

      - name: Definir versao Android crescente
        shell: bash
        run: |
          echo "STELLAR_VERSION_CODE=$((640000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar o Stellar Legacy original
        run: npm run verify

      - name: Empacotar recursos locais do APK
        run: |
          node scripts/prepare-apk-assets.js
          node scripts/verify-apk.js

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK de testes
        run: |
          gradle --no-daemon -p android :app:assembleDebug

      - name: Disponibilizar APK de testes
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Legacy-V64-APK-Local-Teste
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Preparar chave de assinatura de producao
        if: ${{ inputs.build_release }}
        env:
          KEYSTORE_B64: ${{ secrets.STELLAR_KEYSTORE_BASE64 }}
          STELLAR_KEYSTORE_PASSWORD: ${{ secrets.STELLAR_KEYSTORE_PASSWORD }}
          STELLAR_KEY_ALIAS: ${{ secrets.STELLAR_KEY_ALIAS }}
          STELLAR_KEY_PASSWORD: ${{ secrets.STELLAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for required in KEYSTORE_B64 STELLAR_KEYSTORE_PASSWORD STELLAR_KEY_ALIAS STELLAR_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Secret de assinatura ausente: $required"
              exit 1
            fi
          done

          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/stellar-release.jks"
          echo "STELLAR_KEYSTORE_FILE=$RUNNER_TEMP/stellar-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK assinado
        if: ${{ inputs.build_release }}
        env:
          STELLAR_KEYSTORE_PASSWORD: ${{ secrets.STELLAR_KEYSTORE_PASSWORD }}
          STELLAR_KEY_ALIAS: ${{ secrets.STELLAR_KEY_ALIAS }}
          STELLAR_KEY_PASSWORD: ${{ secrets.STELLAR_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p android :app:assembleRelease

      - name: Disponibilizar APK assinado
        if: ${{ inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Legacy-V64-APK-Local-Assinado
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Limpar chave de assinatura
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${STELLAR_KEYSTORE_FILE:-}" ]; then
            rm -f "$STELLAR_KEYSTORE_FILE"
          fi
