name: 'Stellar Legacy • ATIVAR OFFLINE E LIMPAR V130'
run-name: 'Offline limpo + APK • ${{ github.actor }}'
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite APAGAR_V130_E_ATIVAR_OFFLINE para substituir todos os arquivos antigos'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stellar-offline-clean-activation
  cancel-in-progress: false
jobs:
  preparar_validar_compilar_publicar:
    if: ${{ inputs.confirmacao == 'APAGAR_V130_E_ATIVAR_OFFLINE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Preparar offline e APAGAR todos os arquivos antigos na copia do runner
        shell: bash
        env:
          STELLAR_CONFIRM: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Stellar Legacy offline: select package by CONTENT, replace tracked online repository.
          Runs only inside GitHub Actions checkout after explicit confirmation.
          The accompanying workflow builds+tests before committing.
          """
          from __future__ import annotations
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath
          
          EXPECTED_CONFIRMATION = 'APAGAR_V130_E_ATIVAR_OFFLINE'
          if os.environ.get('STELLAR_CONFIRM') != EXPECTED_CONFIRMATION:
              raise SystemExit('ERRO: confirmacao explicita obrigatoria para substituir o repositorio.')
          root = Path.cwd().resolve()
          if not (root / '.git').exists():
              raise SystemExit('ERRO: execute somente num checkout Git.')
          
          required = {
              'package.json', 'web/index.html', 'web/game.js', 'web/catalog.js',
              'web/storage.js', 'web/routes.js', 'web/pages.js', 'web/camera.js',
              'android/app/build.gradle', 'android/app/src/main/AndroidManifest.xml',
              'tests/offline.test.mjs', '.github/workflows/gerar-apk-offline.yml',
          }
          def version_key(ver):
              match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:-[A-Za-z0-9.-]+)?', str(ver))
              return tuple(map(int, match.group(1,2,3))) if match else None
          
          def get_candidates(archive_path):
              candidates = []
              try:
                  with zipfile.ZipFile(archive_path) as z:
                      files = {}
                      expanded = 0
                      if len(z.infolist()) > 2000:
                          return []
                      for entry in z.infolist():
                          name = entry.filename
                          if (not name or name.startswith('/') or name.startswith('\\') or '\\' in name or
                              any(x in ('', '.', '..') for x in name.rstrip('/').split('/')) or
                              re.match(r'^[A-Za-z]:', name) or
                              ((entry.external_attr >> 16) & 0o170000) == stat.S_IFLNK):
                              return []
                          if entry.is_dir():
                              continue
                          if name in files:
                              return []
                          expanded += entry.file_size
                          if expanded > 400*1024*1024 or entry.file_size > 75*1024*1024:
                              return []
                          files[name] = entry
                      for name in files:
                          if name != 'package.json' and not name.endswith('/package.json'):
                              continue
                          prefix = name[:-len('package.json')]
                          try:
                              pkg = json.loads(z.read(name))
                          except (UnicodeError,ValueError):
                              continue
                          if pkg.get('name') != 'stellar-legacy-offline-apk':
                              continue
                          ver = version_key(pkg.get('version'))
                          if ver is None or not all(prefix+rel in files for rel in required):
                              continue
                          selected = {key[len(prefix):]:key for key in files if key.startswith(prefix)}
                          if not set(required).issubset(selected):
                              continue
                          if any(not (rel in {'package.json','.gitignore','README.md','activate.mjs','OFFLINE_BUNDLE_MANIFEST.json'} or
                                      rel.startswith(('web/','android/','tests/','.github/workflows/')))
                                 for rel in selected):
                              continue
                          if any(rel.startswith('.github/workflows/') and rel!='.github/workflows/gerar-apk-offline.yml'
                                 for rel in selected):
                              continue
                          manifest_key = prefix+'OFFLINE_BUNDLE_MANIFEST.json'
                          is_manifested = manifest_key in files
                          if is_manifested:
                              try:
                                  manifest = json.loads(z.read(manifest_key))
                                  hashes = manifest['files']
                                  if manifest.get('format') != 'stellar-offline-replacement-v2' or len(hashes)<110:
                                      continue
                                  if set(hashes) != set(selected)-{'activate.mjs','OFFLINE_BUNDLE_MANIFEST.json'}:
                                      continue
                                  for rel,digest in hashes.items():
                                      if not re.fullmatch(r'[a-f0-9]{64}',str(digest)) or \
                                         hashlib.sha256(z.read(selected[rel])).hexdigest()!=digest:
                                          raise ValueError('Hash de arquivo diferente')
                              except (KeyError,ValueError,TypeError):
                                  continue
                          # No stage machinery makes it into the final repo.
                          selected.pop('activate.mjs',None)
                          selected.pop('OFFLINE_BUNDLE_MANIFEST.json',None)
                          # Quick content fingerprint detects ambiguous same-version packages.
                          fingerprint = hashlib.sha256()
                          for rel in ('web/game.js','web/routes.js','web/camera.js','package.json'):
                              fingerprint.update(z.read(selected[rel]))
                          candidates.append((ver,is_manifested,str(archive_path),prefix,selected,fingerprint.hexdigest()))
              except (zipfile.BadZipFile,OSError,ValueError):
                  return []
              return candidates
          
          all_packages = []
          for zip_path in sorted(root.glob('*.zip')):
              all_packages.extend(get_candidates(zip_path))
          if not all_packages:
              raise SystemExit('ERRO: nenhum ZIP offline valido encontrado NA RAIZ. O nome pode ser qualquer um; o conteudo deve ser projeto offline completo.')
          all_packages.sort(key=lambda x:(x[0],x[1]), reverse=True)
          version = all_packages[0][0]
          same = [x for x in all_packages if x[0] == version]
          if len({x[5] for x in same}) > 1:
              raise SystemExit('ERRO: varios ZIPs offline da MESMA versao com codigo diferente; retire os antigos para evitar uma substituicao errada.')
          chosen = same[0]
          _,has_manifest,zip_name,prefix,entries,_ = chosen
          print(f'ZIP localizado pelo conteudo: {Path(zip_name).name} | offline {".".join(map(str,version))} | manifesto={has_manifest} | arquivos={len(entries)}')
          
          workflow_ref = os.environ.get('GITHUB_WORKFLOW_REF','')
          if '.github/workflows/' not in workflow_ref or '@' not in workflow_ref:
              raise SystemExit('ERRO: GITHUB_WORKFLOW_REF ausente ou invalido. Nao executar fora do GitHub Actions.')
          wf_name = workflow_ref.split('.github/workflows/',1)[1].split('@',1)[0]
          if not wf_name.endswith(('.yml','.yaml')) or '/' in wf_name or '..' in wf_name:
              raise SystemExit('ERRO: caminho do workflow invalido')
          workflow_source = root/'.github'/'workflows'/wf_name
          if not workflow_source.is_file():
              raise SystemExit('ERRO: workflow de ativacao atual nao localizado: '+str(workflow_source))
          # Make the activation flow stable in the cleaned repository regardless of original filename.
          activation_source = workflow_source.read_bytes()
          canonical_activation = '.github/workflows/ativar-offline.yml'
          tracked = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          
          with zipfile.ZipFile(zip_name) as archive, tempfile.TemporaryDirectory(prefix='stellar-offline-v3-') as tmp:
              staging = Path(tmp)
              for rel, archived in entries.items():
                  dest = staging / rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with archive.open(archived) as src, dest.open('wb') as out:
                      import shutil
                      shutil.copyfileobj(src,out)
              for rel in required:
                  if not (staging/rel).is_file():
                      raise SystemExit('ERRO: arquivo obrigatorio ausente: '+rel)
              offline_pkg = json.loads((staging/'package.json').read_text())
              if offline_pkg.get('name') != 'stellar-legacy-offline-apk':
                  raise SystemExit('ERRO: pacote nao corresponde ao jogo offline')
              native = (staging/'android/app/src/main/AndroidManifest.xml').read_text()
              if 'android.permission.INTERNET' in native:
                  raise SystemExit('ERRO: pacote offline exige permissao de internet!')
              for ext in ('*.js','*.html'):
                  for source in (staging/'web').rglob(ext):
                      if re.search(r'onrender\.com|\.supabase\.co|https://(?!appassets\.androidplatform\.net)' ,source.read_text(errors='replace'),re.I):
                          raise SystemExit('ERRO: dependencia de servidor encontrada em '+str(source))
          
              keep = set(entries) | {canonical_activation}
              # Remove every tracked online/legacy file not present in verified offline bundle.
              # CI checkout is disposable until tests and Android build succeed.
              removed = []
              for rel in tracked:
                  if rel in keep:
                      continue
                  target = root / rel
                  if target.exists() or target.is_symlink():
                      if target.is_file() or target.is_symlink():
                          target.unlink()
                          removed.append(rel)
              for rel in entries:
                  src, dst = staging/rel, root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  if dst.is_symlink():
                      raise SystemExit('ERRO: link simbolico no destino '+rel)
                  dst.write_bytes(src.read_bytes())
          
              dest = root / canonical_activation
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(activation_source)
          
              # No old SQL files, server routes, public V130 assets or online dependencies may remain.
              for parent in ('sql','server','public','docs','scripts'):
                  remaining = [p for p in (root/parent).rglob('*') if p.is_file()] if (root/parent).exists() else []
                  if remaining:
                      raise SystemExit(f'ERRO: diretorio legado ainda contem arquivos: {parent} ({len(remaining)})')
                  if (root/parent).is_dir():
                      shutil.rmtree(root/parent)
              obsolete_workflows = [p for p in (root/'.github/workflows').glob('*') if p.is_file() and
                                    p.relative_to(root).as_posix() not in keep]
              if obsolete_workflows:
                  raise SystemExit('ERRO: workflows legados remanescentes: '+', '.join(x.name for x in obsolete_workflows))
              if any(not (root/rel).is_file() for rel in required):
                  raise SystemExit('ERRO: codigo offline incompleto apos limpeza')
              report = {'selected_archive':Path(zip_name).name,'offline_version':offline_pkg.get('version'),
                        'new_file_count':len(entries),'removed_legacy_count':len(removed),
                        'removed_legacy_files':removed,'kept_workflows':sorted(p for p in keep if p.startswith('.github/workflows/'))}
              # Report is an artifact, NOT committed to the game (doesn't bloat repository).
              output = Path(os.environ.get('RUNNER_TEMP',str(Path('/tmp'))))/'stellar-offline-cleanup-report.json'
              output.write_text(json.dumps(report,indent=2,ensure_ascii=False))
              print(f'Limpeza preparada: {len(removed)} arquivos antigos removidos, {len(entries)} arquivos offline instalados.')
              print('Workflows que permanecem:',report['kept_workflows'])
              print('Relatorio:',output)
          PY
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar e testar SOMENTE o jogo offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").name')" = 'stellar-legacy-offline-apk'
          npm run check
          npm test
          test ! -d sql && test ! -d server && test ! -d public || {
            echo 'ERRO: arquivos online ainda presentes'; exit 1;
          }
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar SDK Android 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK OFFLINE
        shell: bash
        run: |
          set -euo pipefail
          echo "STELLAR_VERSION_CODE=$((130000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          gradle --no-daemon -p android :app:assembleDebug
      - name: Conferir APK offline real
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files=list(Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          assert len(files)==1,f'APK esperado: 1, encontrados: {len(files)}'
          with zipfile.ZipFile(files[0]) as z:
              names=set(z.namelist())
              required=('assets/index.html','assets/game.js','assets/storage.js',
                        'assets/catalog.js','assets/routes.js','assets/pages.js','assets/camera.js')
              for p in required:
                  assert p in names,'Arquivo offline faltando dentro do APK: '+p
              manifest=z.read('AndroidManifest.xml')
          print('APK offline conferido:',files[0],files[0].stat().st_size)
          PY
      - name: Entregar APK e relatorio da limpeza
        uses: actions/upload-artifact@v4
        with:
          name: STELLAR_LEGACY_OFFLINE_APK_LIMPO
          path: |
            android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/stellar-offline-cleanup-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar no GitHub APENAS depois de testes e APK aprovados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stellar Offline Clean Activation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nenhuma mudanca pendente'; exit 0; }
          echo 'Resumo das exclusoes e inclusoes:'
          git diff --cached --stat | tail -25
          git commit -m 'release: substituir V130 online por Stellar Offline V3 limpo'
          git push origin HEAD:main
