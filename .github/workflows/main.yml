name: Stellar Auto Installer

# STELLAR LEGACY AUTO INSTALLER
# Para mudar a pasta de upload, altere "updates/*.zip" abaixo e as referências
# "updates/" no script. O padrão recomendado é manter /updates.

on:
  push:
    paths:
      - 'updates/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stellar-auto-installer
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar ZIP mais recente
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(updates/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum ZIP encontrado em /updates."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(ls -1t updates/*.zip | head -n 1)
          echo "ZIP selecionado: $newest"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$newest" >> "$GITHUB_OUTPUT"

      - name: Validar e extrair atualização
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.path }}"
          rm -rf .stellar-update
          mkdir -p .stellar-update/raw .stellar-update/stage

          # Bloqueia pacotes absurdamente grandes antes de extrair.
          bytes=$(unzip -l "$ZIP" | awk 'END {print $1+0}')
          max=$((350*1024*1024))
          if [ "$bytes" -gt "$max" ]; then
            echo "ZIP excede 350 MB descompactado. Abortando."
            exit 1
          fi

          unzip -q "$ZIP" -d .stellar-update/raw

          # Aceita ZIP com os arquivos na raiz ou dentro de uma pasta principal.
          src=.stellar-update/raw
          entries=$(find "$src" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          dirs=$(find "$src" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "$entries" = "1" ] && [ "$dirs" = "1" ]; then
            src=$(find "$src" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi

          if [ ! -f "$src/package.json" ]; then
            echo "package.json não encontrado no pacote. Nenhum arquivo foi alterado."
            exit 1
          fi

          node -e "const p=require(process.argv[1]); if(!p.name) process.exit(1); console.log('Pacote:',p.name,'versão',p.version||'sem versão')" "$src/package.json"
          rsync -a "$src/" .stellar-update/stage/

          if [ -f .stellar-update/stage/public/game.js ]; then
            node --check .stellar-update/stage/public/game.js
          fi
          if [ -f .stellar-update/stage/server/index.js ]; then
            node --check .stellar-update/stage/server/index.js
          fi

      - name: Instalar pacote no repositório
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='updates/' \
            --exclude='.stellar-update/' \
            .stellar-update/stage/ ./

          rm -f updates/*.zip
          rm -rf .stellar-update

      - name: Commit automático
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stellar Auto Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para publicar."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version || 'update'" 2>/dev/null || echo update)
          git commit -m "AUTO INSTALL: Stellar Legacy v${VERSION} [skip ci]"
          git push
