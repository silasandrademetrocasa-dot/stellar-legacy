name: "🛠️ Instalar PATCH Stellar Legacy V19.0.6"
run-name: "Aplicar patch V19.0.6 sem apagar o jogo • ${{ github.actor }}"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stellar-zip-installer
  cancel-in-progress: false

jobs:
  instalar_patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o projeto atual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Conferir ZIP, versão base e conteúdo do patch
        shell: bash
        run: |
          set -euo pipefail
          test -f STELLAR_FASE2_PATCH_V19.0.6.zip || { echo '❌ Falta STELLAR_FASE2_PATCH_V19.0.6.zip na raiz do GitHub.'; exit 1; }
          CURRENT=$(node -p "require('./package.json').version")
          test "$CURRENT" = '19.0.5' || { echo "❌ Esperada V19.0.5, encontrada V$CURRENT. Nada modificado."; exit 1; }
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          p=Path('STELLAR_FASE2_PATCH_V19.0.6.zip')
          if not zipfile.is_zipfile(p):
              raise SystemExit('❌ ZIP inválido.')
          root=Path('/tmp/stellar-fase2-safe')
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(p) as z:
              total=0
              for info in z.infolist():
                  q=PurePosixPath(info.filename)
                  if q.is_absolute() or '..' in q.parts or not q.parts or q.parts[0]!='stellar_fase2_v19_0_6':
                      raise SystemExit(f'❌ Caminho inseguro/inválido: {info.filename}')
                  mode=(info.external_attr >> 16) & 0o170000
                  if mode==stat.S_IFLNK:
                      raise SystemExit('❌ Link simbólico não permitido no patch.')
                  total+=info.file_size
                  if total>20*1024*1024:
                      raise SystemExit('❌ Patch maior que o limite de 20 MB descompactados.')
              z.extractall(root)
          bundle=root/'stellar_fase2_v19_0_6'
          for filename in ['INSTALAR_FASE2.mjs', 'patches/gate_admin.js.txt','patches/gate_runtime.js.txt','sql/V19_0_6_ADM_PORTAIS.sql']:
              if not (bundle/filename).is_file():
                  raise SystemExit(f'❌ Arquivo obrigatório faltando no patch: {filename}')
          print('✅ ZIP e estrutura conferidos; SHA256:', hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Aplicar somente as alterações da Fase 2
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/stellar-fase2-safe/stellar_fase2_v19_0_6/INSTALAR_FASE2.mjs

      - name: Conferir JavaScript e alterações previstas
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '19.0.6'
          test -f sql/V19_0_6_ADM_PORTAIS.sql
          for file in public/game.js public/api.js public/data.js server/index.js server/world.js; do
            node --check "$file"
          done
          git diff --check
          echo '✅ Arquivos alterados:'
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed={'public/game.js','public/api.js','public/index.html','public/style.css',
                   'server/index.js','package.json','CHANGELOG.md','sql/V19_0_6_ADM_PORTAIS.sql'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          unexpected=changed-allowed
          if unexpected:raise SystemExit('❌ O patch tocou arquivos inesperados: '+', '.join(sorted(unexpected)))
          required={'public/game.js','public/api.js','public/index.html','server/index.js','package.json'}
          if not required.issubset(changed):raise SystemExit('❌ Não foram detectadas todas as alterações essenciais.')
          print('✅ Patch limitado ao código e configurações previstas.')
          PY

      - name: Publicar patch na main (sem rsync --delete)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stellar Legacy Installer'
          git config user.email 'actions@users.noreply.github.com'
          git add public/game.js public/api.js public/index.html public/style.css server/index.js package.json CHANGELOG.md sql/V19_0_6_ADM_PORTAIS.sql
          git rm -- STELLAR_FASE2_PATCH_V19.0.6.zip
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração a publicar.'
            exit 0
          fi
          git commit -m 'deploy: Stellar Legacy V19.0.6 ADM fase 2 via patch seguro'
          git push origin HEAD:main
          echo '✅ V19.0.6 publicada na main, preservando os assets e arquivos existentes.'
          echo '⚠ Execute sql/V19_0_6_ADM_PORTAIS.sql no Supabase logo após o deploy.'
