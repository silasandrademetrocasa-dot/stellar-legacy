name: 'Stellar Legacy - ATIVAR OFFLINE COMPLETO'
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite ATIVAR_STELLAR_OFFLINE_COMPLETO para substituir a V130 por offline'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: stellar-offline-activation
  cancel-in-progress: false
jobs:
  ativar_e_compilar:
    if: ${{ inputs.confirmacao == 'ATIVAR_STELLAR_OFFLINE_COMPLETO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar offline do ZIP que ja existe no GitHub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, stat, sys, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          stage = root / 'stellar-offline-stage'
          zip_path = root / 'STELLAR_LEGACY_OFFLINE_APK_V3_STAGE_INSTALADOR.zip'
          expected_hash = '482e339f5da18599728a300a8e1b8dfc8991a2ad34b1125678a4604d9e0c56b3'
          if (stage / 'activate.mjs').is_file():
              print('O stage ja esta instalado; usando arquivos presentes.')
              sys.exit(0)
          if stage.exists():
              raise SystemExit('Stage parcial detectado: instalacao interrompida, sem modificar os arquivos.')
          if not zip_path.is_file():
              raise SystemExit('ZIP offline nao encontrado na raiz do repositorio.')
          digest = hashlib.file_digest(zip_path.open('rb'), 'sha256').hexdigest()
          if digest != expected_hash:
              raise SystemExit('O ZIP nao corresponde ao pacote offline validado; nao sera executado.')
          with tempfile.TemporaryDirectory(prefix='stellar-offline-stage-') as t:
              sandbox = Path(t)
              members = 0
              total = 0
              seen = set()
              with zipfile.ZipFile(zip_path) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit('Arquivo ZIP corrompido.')
                  for entry in archive.infolist():
                      name = entry.filename
                      path = PurePosixPath(name)
                      if (not name or name.startswith('/') or '\\' in name or
                          '..' in path.parts or '.' in path.parts or
                          (name != 'OFFLINE_STAGE_INFO.txt' and
                           (not name.startswith('stellar-offline-stage/') or len(path.parts) < 2))):
                          raise SystemExit('Caminho nao permitido no ZIP: ' + name)
                      if name in seen:
                          raise SystemExit('Entrada repetida no ZIP: ' + name)
                      seen.add(name)
                      mode = (entry.external_attr >> 16) & 0o170000
                      if mode == stat.S_IFLNK:
                          raise SystemExit('Link simbolico no ZIP: ' + name)
                      if entry.is_dir():
                          continue
                      members += 1
                      total += entry.file_size
                      if members > 250 or total > 80 * 1024 * 1024:
                          raise SystemExit('ZIP excede os limites de seguranca.')
                      destination = sandbox.joinpath(*path.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as source, destination.open('wb') as target:
                          shutil.copyfileobj(source, target)
              candidate = sandbox / 'stellar-offline-stage'
              manifest_path = candidate / 'OFFLINE_BUNDLE_MANIFEST.json'
              if not (candidate / 'activate.mjs').is_file() or not manifest_path.is_file():
                  raise SystemExit('ZIP nao contem o ativador e manifesto esperados.')
              manifest = json.loads(manifest_path.read_text(encoding='utf8'))
              if manifest.get('format') != 'stellar-offline-replacement-v2' or len(manifest.get('files', {})) < 110:
                  raise SystemExit('Manifesto offline incompleto.')
              for relative, expected in manifest['files'].items():
                  file = candidate / relative
                  if (not file.is_file() or file.is_symlink() or
                      hashlib.sha256(file.read_bytes()).hexdigest() != expected):
                      raise SystemExit('Verificacao de integridade falhou: ' + relative)
              shutil.move(str(candidate), str(stage))
              print(f'Offline preparado a partir do ZIP: {members} arquivos, {total} bytes.')
          PY
      - name: Ativar jogo offline na copia do runner
        env:
          STELLAR_CONFIRM: ${{ inputs.confirmacao }}
        run: node stellar-offline-stage/activate.mjs
      - name: Validar codigo offline
        run: npm run check && npm test
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK com arquivos locais
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Conferir conteudo offline do APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          paths = list(Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          assert len(paths) == 1, 'Nenhum APK debug ou mais de um APK encontrado'
          with zipfile.ZipFile(paths[0]) as z:
              names = set(z.namelist())
              for required in ('assets/index.html', 'assets/game.js', 'assets/storage.js', 'assets/catalog.js'):
                  assert required in names, f'Asset offline ausente no APK: {required}'
          print(f'APK validado: {paths[0]}')
          PY
      - name: Entregar APK antes de publicar o repositorio
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Legacy-Offline-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar substituicao somente apos validacao e APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stellar Offline Activation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Sem alteracoes'; exit 0; }
          git commit -m 'release: substituir Stellar V130 por Universo Solo offline APK'
          git push origin HEAD:main
