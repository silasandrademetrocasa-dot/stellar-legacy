name: 🚀 Stellar Legacy — Instalador Universal
run-name: Instalar ZIP universal • ${{ github.actor }}
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stellar-zip-installer
  cancel-in-progress: false
jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Selecionar ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%P\n' | sort)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            printf 'Exatamente um ZIP deve estar na raiz. Encontrados: %s\n' "${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          echo "STELLAR_ZIP=${ZIPS[0]}" >> "$GITHUB_ENV"
      - name: Aplicar ZIP com segurança
        run: python3 scripts/stellar-universal-installer.py "$STELLAR_ZIP"
      - name: Validar projeto
        shell: bash
        run: |
          set -euo pipefail
          for p in package.json public/game.js public/api.js public/data.js server/index.js; do test -f "$p"; done
          node --check public/game.js
          node --check public/api.js
          node --check public/data.js
          node --check server/index.js
          npm run check
          npm test
      - name: Publicar somente se testes passarem
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stellar Legacy Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nenhuma alteração"; exit 0; fi
          git commit -m "deploy: Stellar Legacy via Universal ZIP Installer"
          git push origin HEAD:main
