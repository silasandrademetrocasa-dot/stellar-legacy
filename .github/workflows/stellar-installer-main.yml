name: 🚀 Instalar versão do Stellar Legacy
run-name: Instalar pacote do Stellar Legacy • ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stellar-zip-installer
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar a main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar pacote da nova versão
        shell: bash
        run: |
          set -euo pipefail

          rm -f /tmp/stellar-upload.zip

          mapfile -t B64S < <(find . -maxdepth 1 -type f -name 'stellar-legacy*.zip.b64' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name 'stellar-legacy*.zip' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)

          if [ "${#B64S[@]}" -gt 0 ]; then
            PAYLOAD_FILE="${B64S[0]#./}"
            ZIP_FILE="/tmp/stellar-upload.zip"
            echo "📦 Usando pacote Base64: $PAYLOAD_FILE"
            tr -d '\r\n\t ' < "$PAYLOAD_FILE" | base64 -d > "$ZIP_FILE"
          elif [ "${#ZIPS[@]}" -eq 1 ]; then
            PAYLOAD_FILE="${ZIPS[0]#./}"
            ZIP_FILE="$PAYLOAD_FILE"
            echo "📦 Usando ZIP binário: $ZIP_FILE"
          elif [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "❌ Há mais de um ZIP e nenhum pacote Base64 foi encontrado."
            printf ' - %s\n' "${ZIPS[@]}"
            exit 1
          else
            echo "❌ Nenhum pacote encontrado."
            echo "Envie stellar-legacy-*.zip.b64 (recomendado) ou um único stellar-legacy-*.zip."
            exit 1
          fi

          echo "PAYLOAD_FILE=$PAYLOAD_FILE" >> "$GITHUB_ENV"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          p=Path(os.environ['ZIP_FILE'])
          data=p.read_bytes()
          print(f'✅ Arquivo reconstruído: {len(data)} bytes')
          print(f'✅ SHA-256: {hashlib.sha256(data).hexdigest()}')
          if not zipfile.is_zipfile(p):
              raise SystemExit('❌ O pacote reconstruído ainda não é um ZIP válido.')
          print('✅ Assinatura ZIP válida antes da extração.')
          PY

      - name: Validar e extrair o pacote
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stellar-release
          mkdir -p /tmp/stellar-release

          python3 - <<'PY'
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          zip_path = Path(os.environ['ZIP_FILE'])
          out = Path('/tmp/stellar-release')

          with zipfile.ZipFile(zip_path) as z:
              total = 0
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'ZIP inválido: caminho perigoso: {info.filename}')
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'ZIP inválido: link simbólico não permitido: {info.filename}')
                  total += info.file_size
                  if total > 2 * 1024 * 1024 * 1024:
                      raise SystemExit('ZIP inválido: conteúdo descompactado acima de 2 GB.')
              z.extractall(out)

          def valid_root(path: Path) -> bool:
              return (
                  (path / 'package.json').is_file()
                  and (path / 'public' / 'game.js').is_file()
                  and (path / 'public' / 'api.js').is_file()
                  and (path / 'public' / 'data.js').is_file()
                  and (path / 'server' / 'index.js').is_file()
              )

          source = out
          if not valid_root(source):
              children = [p for p in out.iterdir() if p.name not in {'__MACOSX', '.DS_Store'}]
              dirs = [p for p in children if p.is_dir()]
              files = [p for p in children if p.is_file()]
              if len(dirs) == 1 and not files and valid_root(dirs[0]):
                  source = dirs[0]
              else:
                  raise SystemExit('Estrutura inválida: package.json, public/ e server/ não encontrados.')

          pkg = json.loads((source / 'package.json').read_text(encoding='utf-8'))
          version = str(pkg.get('version', '')).strip()
          if not version:
              raise SystemExit('package.json sem versão.')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SOURCE_DIR={source}\n')
              env.write(f'STELLAR_VERSION={version}\n')

          print(f'✅ Estrutura validada: {source}')
          print(f'✅ Versão detectada: {version}')
          PY

      - name: Instalar a nova versão
        shell: bash
        run: |
          set -euo pipefail

          # --checksum evita o bug anterior em que package.json podia ter
          # mesmo tamanho/data e o rsync mantinha a versão velha.
          rsync -a --checksum --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='stellar-legacy*.zip' \
            --exclude='stellar-legacy*.zip.b64' \
            "$SOURCE_DIR/" ./

          rm -f ./stellar-legacy*.zip ./stellar-legacy*.zip.b64

          if [ ! -f "$SOURCE_DIR/.chatgpt-deployed-version" ]; then
            rm -f .chatgpt-deployed-version
          fi

          echo "✅ Stellar Legacy V$STELLAR_VERSION instalado na área de trabalho da Action."

      - name: Validar o jogo antes do commit
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/main.yml
          test -f package.json
          test -f public/game.js
          test -f public/api.js
          test -f public/data.js
          test -f server/index.js

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$STELLAR_VERSION" ]; then
            echo "❌ Versão divergente: package.json=$PACKAGE_VERSION | detectada=$STELLAR_VERSION"
            exit 1
          fi

          node --check public/game.js
          node --check public/api.js
          node --check public/data.js
          node --check server/index.js

          echo "✅ Validação concluída na V$PACKAGE_VERSION."

      - name: Mostrar o que será alterado
        shell: bash
        run: |
          echo "### Stellar Legacy V$STELLAR_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pacote instalado: \`$PAYLOAD_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --short

      - name: Commit e Push na main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Stellar Legacy Installer"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nada mudou além do que já estava instalado."
            exit 0
          fi

          git commit -m "deploy: Stellar Legacy V${STELLAR_VERSION} via pacote seguro"
          git push origin HEAD:main
          echo "✅ V$STELLAR_VERSION publicada na main."
